<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Primary Brand Gradient -->
    <linearGradient id="aurora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B4DFF" />
      <stop offset="50%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
  </defs>
  
  <g transform="translate(400, 200)">
    <!-- Glowing Arc (Circle with a gap at the bottom) -->
    <path d="M -77, 92 A 120,120 0 1,1 77, 92" fill="none" stroke="url(#aurora-grad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Stylized Geometric 'A' -->
    <path d="M -50, 60 L 0, -40 L 50, 60" fill="none" stroke="url(#aurora-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -23, 10 L 23, 10" fill="none" stroke="url(#aurora-grad)" stroke-width="12" stroke-linecap="round" />
  </g>
  
  <!-- Text Elements -->
  <!-- Wordmark: AURORA -->
  <text x="400" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="300" fill="#F2F3F7" letter-spacing="18" text-anchor="middle">AURORA</text>
  
  <!-- Subtitle: AI TECHNOLOGY & CREATIVE AUTOMATION -->
  <text x="400" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#8E94A3" letter-spacing="6" text-anchor="middle">AI TECHNOLOGY &amp; CREATIVE AUTOMATION</text>
</svg>
