<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Primary Brand Gradient -->
    <linearGradient id="aurora-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B4DFF" />
      <stop offset="50%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
  </defs>
  
  <g transform="translate(60, 60)">
    <!-- Glowing Arc (Circle with a gap at the bottom) -->
    <path d="M -32, 38 A 50,50 0 1,1 32, 38" fill="none" stroke="url(#aurora-icon-grad)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Stylized Geometric 'A' -->
    <path d="M -20, 25 L 0, -15 L 20, 25" fill="none" stroke="url(#aurora-icon-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -9, 5 L 9, 5" fill="none" stroke="url(#aurora-icon-grad)" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
